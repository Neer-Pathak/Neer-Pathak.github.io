<!DOCTYPE html>
<html>
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="neer_portfolio" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>neer_portfolio</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      /* Full-screen loader container */
      #flutter-loader {
        position: fixed;
        inset: 0;
        background-color: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        z-index: 9999;
      }

      /* Hello, World! styling */
      /* Updated Hello, World! styling */
      #flutter-loader h1 {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        font-size: 3rem;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 2px 2px 10px #06f;
        margin-bottom: 2rem;
        text-align: center;
      }

      /* Spinner style */
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #06f;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Responsive adjustments */
      @media (max-width: 400px) {
        #flutter-loader h1 {
          font-size: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Custom splash loader -->
    <div id="flutter-loader">
      <h1>Hello, World!</h1>
      <div class="spinner" aria-label="Loading…"></div>
    </div>

    <!-- Flutter entrypoint -->
    <script src="flutter_bootstrap.js" async></script>

    <!-- Hide splash loader after Flutter first frame -->
    <script>
      function hideFlutterLoader() {
        const loader = document.getElementById("flutter-loader");
        if (loader) loader.style.display = "none";
      }

      window.addEventListener("flutter-first-frame", hideFlutterLoader);
      window.addEventListener("load", () => {
        if (window.flutterInitialized) hideFlutterLoader();
      });
      setTimeout(hideFlutterLoader, 10000);
    </script>
  </body>
</html>
